    <style>

        body {

            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;

        .logo {

            -webkit-text-fill-color: transparent;

        }

        .nav-links {
            display: flex;

        }

        .nav-item {
            cursor: pointer;

            padding: 8px 16px;

        .nav-item.active {

        .unread-badge {
            position: absolute;
            top: 2px;
            right: 4px;
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: #ffffff;

        .btn-logout {

        .hamburger-btn span {

        .container {
            flex: 1;

            margin: 40px auto;

        .dm-card {
            background: rgba(255, 255, 255, 0.85);

            border: 1px solid rgba(255, 255, 255, 0.6);

        .dm-header h2 {

            display: flex;

            width: 100%;

                padding: 12px 0 !important;

                text-align: center !important;
                border-radius: 10px;
            }

    <script>
        if (!localStorage.getItem("userEmail") || !localStorage.getItem("sessionToken")) {
            clearHeikoSession();
            window.location.replace("index.html");
        }

        const GAS_URL = "https://script.google.com/macros/s/AKfycbyQgkizdGw9MiZjxtlxAHpfMXw5ehLfj9HkzDcR9YLRo1Cm11kfEp4cWYqnNBdDR96w/exec";
        const bgGradients = [
            "linear-gradient(135deg, #1cbdc5 0%, #119299 100%)",
            "linear-gradient(135deg, #0284c7 0%, #06b6d4 100%)",
            "linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%)",
            "linear-gradient(135deg, #0d9488 0%, #115e59 100%)",
            "linear-gradient(135deg, #6366f1 0%, #4338ca 100%)"
        ];
        let partnersRequest = null;
        let unreadPollTimer = null;
        let firebaseReady = false;
        let firebaseInbox = [];
        let firebaseInboxUnsubscribe = null;
        let firebaseHidden = {};
        let cachedGasPartners = [];
        let lastPartnerSignature = "";
        const partnerNameCache = new Map();
        const partnerImageCache = new Map();
        // 最初の表示は、データがそろってから一度だけ行う（取得できるたびに出し直すと画面がちらつく）
        let initialListReady = false;
        let hasListData = false;
        const INITIAL_WAIT_MS = 4000; // これより遅いときは、取得できた分だけ先に表示する
        const legacyChatTarget = localStorage.getItem("chatTarget") || "";

        async function postGas(payload, timeoutMs = 12000) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
            try {
                const res = await fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify({ ...payload, sessionToken: localStorage.getItem("sessionToken") || "" }),
                    signal: controller.signal
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const result = await res.json();
                if (handleHeikoSessionResponse(result)) throw new Error("ログインの有効期限が切れました");
                return result;
            } finally {
                clearTimeout(timeoutId);
            }
        }

        function withDeadline(promise, timeoutMs, message) {
            let timerId;
            const timeout = new Promise((resolve, reject) => {
                timerId = setTimeout(() => reject(new Error(message)), timeoutMs);
            });
            return Promise.race([promise, timeout]).finally(() => clearTimeout(timerId));
        }

        async function setupFirebaseInbox() {
            if (firebaseReady || !window.HeikoFirebaseChat || !window.HeikoFirebaseChat.enabled) return firebaseReady;
            try {
                const userId = localStorage.getItem("userEmail");
                const hasFirebaseSession = await window.HeikoFirebaseChat.isSignedInAs(userId);
                if (!hasFirebaseSession) {
                    const result = await postGas({ mode: "firebaseCustomToken", userId: userId }, 10000);
                    const token = result && result.message && result.message.token;
                    if (!token || !await window.HeikoFirebaseChat.signIn(token, userId)) return false;
                }
                try {
                    firebaseInbox = await window.HeikoFirebaseChat.readInbox(userId);
                } catch (inboxError) {
                    if (!legacyChatTarget || legacyChatTarget === userId) throw inboxError;
                    firebaseInbox = [];
                    console.warn("Firebase受信箱の読み込みに失敗したため会話を復元します", inboxError);
                }
                try {
                    firebaseHidden = await window.HeikoFirebaseChat.readHidden(userId);
                } catch (hiddenError) {
                    console.warn("非表示にした会話を読み込めませんでした", hiddenError);
                }
                if (legacyChatTarget && legacyChatTarget !== userId) {
                    const legacyMessages = await window.HeikoFirebaseChat.readOnce(userId, legacyChatTarget);
                    const messageMap = new Map(firebaseInbox.map(message => [String(message.messageId), message]));
                    legacyMessages.forEach(message => messageMap.set(String(message.messageId), message));
                    firebaseInbox = Array.from(messageMap.values()).sort((a, b) => Number(b.sentAt || 0) - Number(a.sentAt || 0));
                }
                firebaseReady = true;
                startFirebaseInboxSubscription();
                return true;
            } catch (error) {
                firebaseReady = false;
                console.warn("Firebase受信箱を利用できません", error);
                return false;
            }
        }

        function startFirebaseInboxSubscription() {
            if (firebaseInboxUnsubscribe || !firebaseReady) return;
            const userId = localStorage.getItem("userEmail");
            firebaseInboxUnsubscribe = window.HeikoFirebaseChat.subscribeInbox(userId, messages => {
                firebaseInbox = messages;
                const list = document.getElementById("partner-list");
                renderPartnerList(cachedGasPartners, list);
                enrichPartnerNames(cachedGasPartners, list);
            }, error => console.warn("Firebase受信箱の購読エラー:", error));
        }

        // 「削除」で非表示にした会話は、その時刻より前のFirebaseのメッセージを一覧に出さない
        function getVisibleFirebaseMessages(messages) {
            const myUserId = localStorage.getItem("userEmail");
            return messages.filter(message => {
                const partner = message.from === myUserId ? message.to : message.from;
                if (!partner) return false;
                const hiddenAt = Number(firebaseHidden[window.HeikoFirebaseChat.getFirebaseUid(partner)] || 0);
                return !hiddenAt || !message.sentAt || Number(message.sentAt) > hiddenAt;
            });
        }

        function mergePartnerLists(gasPartners, firebaseMessages) {
            const map = new Map();
            const timestamp = value => typeof value === "number" ? value : (Date.parse(value) || 0);
            gasPartners.forEach(partner => {
                const email = String(partner.email || "").trim();
                if (!email) return;
                map.set(email, {
                    ...partner,
                    email: email,
                    name: partnerNameCache.get(email) || partner.name || email,
                    preview: partner.preview || partner.lastMessage || "",
                    sentAt: timestamp(partner.sentAt),
                    source: "gas"
                });
            });
            const myUserId = localStorage.getItem("userEmail");
            getVisibleFirebaseMessages(firebaseMessages).forEach(message => {
                const email = message.from === myUserId ? message.to : message.from;
                if (!email || email === myUserId || message.isUnsent) return;
                const previous = map.get(email);
                const preview = message.text || (Array.isArray(message.attachments) && message.attachments.length > 0 ? "画像が送信されました" : "");
                if (!previous || timestamp(message.sentAt) >= timestamp(previous.sentAt)) {
                    map.set(email, {
                        ...previous,
                        email: email,
                        name: partnerNameCache.get(email) || (previous && previous.name) || email,
                        preview: preview,
                        sentAt: timestamp(message.sentAt),
                        source: "firebase"
                    });
                }
            });
            return Array.from(map.values()).sort((a, b) => Number(b.sentAt || 0) - Number(a.sentAt || 0));
        }

        async function enrichPartnerNames(gasPartners, listDiv) {
            const partners = mergePartnerLists(gasPartners, firebaseInbox);
            const targetUserIds = partners.filter(partner => !partnerNameCache.has(partner.email)).map(partner => partner.email).slice(0, 50);
            if (targetUserIds.length === 0) return;
            try {
                const result = await postGas({ mode: "getUserProfiles", userId: localStorage.getItem("userEmail"), targetUserIds: targetUserIds }, 10000);
                if (result.status !== "success" || !Array.isArray(result.message)) return;
                result.message.forEach(profile => {
                    const email = String(profile.userId || "").trim();
                    const name = String(profile.name || "").trim();
                    if (email && name) partnerNameCache.set(email, name);
                    if (email && profile.profileImage) partnerImageCache.set(email, profile.profileImage);
                });
                renderPartnerList(gasPartners, listDiv);
            } catch (error) {
                console.warn("相手の表示名取得エラー:", error);
            }
        }

        function toggleMenu() {
            document.getElementById("hud-menu-btn").classList.toggle("open");
            document.getElementById("nav-links").classList.toggle("open");
        }

        function closeMenu() {
            document.getElementById("hud-menu-btn").classList.remove("open");
            document.getElementById("nav-links").classList.remove("open");
        }

        async function loadChatPartners() {
            if (partnersRequest) return partnersRequest;
            partnersRequest = loadChatPartnersOnce();
            try {
                return await partnersRequest;
            } finally {
                partnersRequest = null;
            }
        }

        function createPartnerItem(email, colorIndex) {
            const item = document.createElement("div");
            item.className = "partner-item";
            item.dataset.partnerEmail = email;
            item.tabIndex = 0;
            item.setAttribute("role", "link");
            item.onclick = () => openChat(email, item.dataset.partnerName);
            item.addEventListener("keydown", event => {
                if (event.target === item && (event.key === "Enter" || event.key === " ")) {
                    event.preventDefault();
                    openChat(email, item.dataset.partnerName);
                }
            });
            const avatarRing = document.createElement("div");
            avatarRing.className = "avatar-ring";
            const avatar = document.createElement("div");
            avatar.className = "partner-avatar";
            avatar.style.background = bgGradients[colorIndex % bgGradients.length];
            avatarRing.appendChild(avatar);
            const contentBox = document.createElement("div");
            contentBox.className = "partner-content-box";
            const name = document.createElement("div");
            name.className = "partner-name";
            const emailLine = document.createElement("div");
            emailLine.className = "partner-email";
            const preview = document.createElement("div");
            preview.className = "partner-preview";
            contentBox.append(name, emailLine, preview);
            const arrow = document.createElement("div");
            arrow.className = "arrow-badge";
            arrow.textContent = "開く ➔";
            const deleteButton = document.createElement("button");
            deleteButton.type = "button";
            deleteButton.className = "partner-delete-button";
            deleteButton.innerText = "削除";
            deleteButton.addEventListener("click", event => {
                event.stopPropagation();
                deleteChatPartner(email, deleteButton);
            });
            item.append(avatarRing, contentBox, arrow, deleteButton);
            return item;
        }

        // 変わった部分だけを書き換える（同じ内容を書き直さない）
        function updatePartnerItem(item, partner) {
            const setText = (element, text) => { if (element.textContent !== text) element.textContent = text; };
            const displayName = partner.name || partner.email;
            item.dataset.partnerName = partner.name || "";
            item.setAttribute("aria-label", `${displayName}とのチャットを開く`);
            setText(item.querySelector(".partner-name"), partner.name || "");
            const sentLabel = formatPartnerTime(partner.sentAt);
            const emailLine = item.querySelector(".partner-email");
            const emailKey = `${partner.email}|${sentLabel}`;
            if (emailLine.dataset.key !== emailKey) {
                emailLine.dataset.key = emailKey;
                emailLine.textContent = partner.email;
                if (sentLabel) {
                    const time = document.createElement("span");
                    time.className = "partner-time";
                    time.textContent = `・${sentLabel}`;
                    emailLine.appendChild(time);
                }
            }
            setText(item.querySelector(".partner-preview"), partner.preview || "メッセージを開く");
            const avatar = item.querySelector(".partner-avatar");
            const initial = partner.name ? partner.name.charAt(0) : "未";
            const image = partner.profileImage || "";
            if (avatar.dataset.initial === initial && avatar.dataset.image === image) return;
            avatar.dataset.initial = initial;
            avatar.dataset.image = image;
            avatar.classList.remove("has-image");
            avatar.textContent = initial;
            heikoApplyAvatar(avatar, image);
        }

        function renderPartnerList(gasPartners, listDiv) {
            if (!initialListReady) return;
            const partners = mergePartnerLists(gasPartners, firebaseInbox)
                .map(partner => ({ ...partner, profileImage: partnerImageCache.get(partner.email) || partner.profileImage || "" }));
            const signature = JSON.stringify(partners.map(p => [p.email, p.name, p.preview, formatPartnerTime(p.sentAt), p.profileImage]));
            if (signature === lastPartnerSignature) return;
            lastPartnerSignature = signature;
            if (partners.length === 0) {
                listDiv.innerHTML = `<div class="empty-message">メッセージはまだありません。<br>ホーム画面から気になる人にチャットを送ってみましょう！</div>`;
                return;
            }
            const existing = new Map();
            Array.from(listDiv.children).forEach(child => {
                if (child.dataset.partnerEmail) existing.set(child.dataset.partnerEmail, child);
                else child.remove(); // スケルトンや案内の文
            });
            partners.forEach((partner, index) => {
                const item = existing.get(partner.email) || createPartnerItem(partner.email, index);
                existing.delete(partner.email);
                updatePartnerItem(item, partner);
                if (listDiv.children[index] !== item) listDiv.insertBefore(item, listDiv.children[index] || null);
            });
            existing.forEach(item => item.remove());
        }

        function showInitialList(listDiv) {
            if (initialListReady || !hasListData) return;
            initialListReady = true;
            renderPartnerList(cachedGasPartners, listDiv);
        }

        async function loadChatPartnersOnce() {
            const myEmail = localStorage.getItem("userEmail");
            const listDiv = document.getElementById("partner-list");
            let gasPartners = cachedGasPartners;
            let hasRendered = false;
            // 受信できた内容がそろうのを待つ。時間がかかるときは、その時点の内容を表示する
            const waitTimer = initialListReady ? null : setTimeout(() => showInitialList(listDiv), INITIAL_WAIT_MS);
            if (!lastPartnerSignature && !listDiv.querySelector(".sk-wrap")) listDiv.innerHTML = heikoSkeleton.list(4);

            const firebaseTask = (async () => {
                try {
                    if (firebaseReady && !firebaseInboxUnsubscribe) firebaseInbox = await window.HeikoFirebaseChat.readInbox(myEmail);
                    else await setupFirebaseInbox();
                    if (firebaseReady) {
                        hasListData = true;
                        renderPartnerList(cachedGasPartners, listDiv);
                        hasRendered = true;
                    }
                } catch (error) {
                    console.warn("Firebase一覧取得エラー:", error);
                }
            })();

            try {
                const result = await withDeadline(postGas({ mode: "getChatPartners", email: myEmail }, 10000), 10000, "GAS一覧の取得が時間切れになりました");
                if (result.status !== "success") throw new Error(result.message || "一覧を取得できませんでした");
                gasPartners = Array.isArray(result.message) ? result.message : [];
                cachedGasPartners = gasPartners;
                hasListData = true;
                renderPartnerList(gasPartners, listDiv);
                hasRendered = true;
            } catch (error) {
                console.warn("GAS一覧取得エラー:", error);
                if (!hasRendered) {
                    try {
                        await setupFirebaseInbox();
                        if (firebaseReady) {
                            hasListData = true;
                            renderPartnerList(gasPartners, listDiv);
                            hasRendered = true;
                        }
                    } catch (retryError) {
                        console.warn("Firebase一覧の再試行に失敗しました:", retryError);
                    }
                }
                if (!hasRendered && !hasListData) listDiv.innerHTML = `<div class="empty-message">メッセージを取得できませんでした。上部の更新ボタンで再試行してください。</div>`;
            }

            await withDeadline(firebaseTask, 10000, "Firebase一覧の取得が時間切れになりました").catch(error => console.warn(error.message));
            if (!hasListData) {
                clearTimeout(waitTimer);
                return;
            }
            // 名前とアイコンもそろえてから表示する（2回目以降は変わった部分だけが書き換わる）
            await enrichPartnerNames(cachedGasPartners, listDiv);
            clearTimeout(waitTimer);
            showInitialList(listDiv);
        }

        // 未読の数と新着の知らせは notify.js がまとめて行う
        async function updateUnreadBadge() {
            if (window.HeikoNotify) await window.HeikoNotify.refresh();
        }

        // 最後のやり取りがいつかを一目でわかるようにする（今日は時刻、昨日は「昨日」、それ以前は日付）
        function formatPartnerTime(value) {
            const time = typeof value === "number" ? value : (Date.parse(value) || 0);
            if (!time) return "";
            const date = new Date(time);
            const now = new Date();
            const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
            if (time >= startOfToday) return `${date.getHours()}:${String(date.getMinutes()).padStart(2, "0")}`;
            if (time >= startOfToday - 86400000) return "昨日";
            if (date.getFullYear() === now.getFullYear()) return `${date.getMonth() + 1}/${date.getDate()}`;
            return `${date.getFullYear()}/${date.getMonth() + 1}/${date.getDate()}`;
        }

        function openChat(email, name) {
            localStorage.setItem("chatTarget", email);
            if (name) localStorage.setItem("chatTargetName", name);
            else localStorage.removeItem("chatTargetName");
            location.href = 'chat.html';
        }

        async function deleteChatPartner(email, button) {
            if (!confirm("この相手とのメッセージ一覧を削除しますか？\n自分の画面から非表示になります。相手の画面には影響しません。")) return;

            const originalText = button.innerText;
            button.disabled = true;
            button.innerText = "削除中...";

            try {
                const myUserId = localStorage.getItem("userEmail");
                if (firebaseReady) {
                    await window.HeikoFirebaseChat.hideConversation(myUserId, email);
                    firebaseHidden[window.HeikoFirebaseChat.getFirebaseUid(email)] = Date.now();
                }
                const result = await postGas({
                    mode: "deleteChatHistory",
                    userId: myUserId,
                    targetUserId: email
                });

                if (result.status === "success") {
                    await loadChatPartners();
                } else {
                    button.disabled = false;
                    button.innerText = originalText;
                    alert("リストの削除に失敗しました: " + result.message);
                }
            } catch (e) {
                button.disabled = false;
                button.innerText = originalText;
                alert("通信エラーが発生しました。");
            }
        }

        function logout() {
            clearHeikoSession();
            window.location.href = "index.html";
        }

        function startUnreadPoll() {
            if (unreadPollTimer) return;
            unreadPollTimer = setInterval(() => {
                if (document.visibilityState === "visible") {
                    loadChatPartners();
                    updateUnreadBadge();
                }
            }, 15000);
        }

        function stopUnreadPoll() {
            clearInterval(unreadPollTimer);
            unreadPollTimer = null;
        }

        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible") {
                updateUnreadBadge();
                startUnreadPoll();
            } else {
                stopUnreadPoll();
            }
        });
        window.addEventListener("pagehide", () => {
            stopUnreadPoll();
            if (firebaseInboxUnsubscribe) firebaseInboxUnsubscribe();
            firebaseInboxUnsubscribe = null;
        });
        window.addEventListener("pageshow", event => {
            if (event.persisted) {
                startFirebaseInboxSubscription();
                loadChatPartners();
                updateUnreadBadge();
                startUnreadPoll();
            }
        });

        // 画像や外部ファイルの読み込み完了（load）を待たず、HTML の準備ができた時点でデータ取得を始める
        async function initializePage() {
            document.getElementById("hud-menu-btn").classList.remove("open");
            document.getElementById("nav-links").classList.remove("open");

            const currentUserId = localStorage.getItem("userId") || localStorage.getItem("userEmail");
            const adminButton = document.getElementById("nav-admin-btn");
            if (adminButton && currentUserId === "admin" && localStorage.getItem("isImpersonating") !== "true") {
                adminButton.style.display = "inline-block";
            }


            await loadChatPartners();
            updateUnreadBadge();

            startUnreadPoll();
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", initializePage, { once: true });
        } else {
            initializePage();
        }
    </script>
</body>
